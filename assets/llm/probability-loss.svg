<svg xmlns="http://www.w3.org/2000/svg" width="360" height="400" viewBox="0 0 360 400" role="img" aria-labelledby="title desc">
  <title id="title">给实际 token 的概率越低，损失越大</title>
  <desc id="desc">教学计算图。横轴为模型给同一个实际 token 的概率，纵轴为单个位置的负二进制对数损失，单位 bit。概率10%、30%、60%、90%对应损失3.32、1.74、0.74、0.15。它不表示事实可信度。</desc>
  <rect width="360" height="400" rx="12" fill="#f5f7fa"/>
  <g font-family="system-ui, PingFang SC, Microsoft YaHei, sans-serif" fill="#172b4d">
    <text x="24" y="36" font-size="24" font-weight="700">实际项概率低，损失更大</text>
    <text x="24" y="66" font-size="20">同一个实际 token · 教学计算</text>
    <text x="24" y="104" font-size="20">损失（bit）</text>
    <path d="M58 122V302H326" fill="none" stroke="#42526e" stroke-width="2"/>
    <path d="M58 257H326 M58 212H326 M58 167H326 M58 122H326" fill="none" stroke="#b9c4cf" stroke-width="1"/>
    <text x="30" y="310" font-size="20">0</text><text x="30" y="265" font-size="20">1</text><text x="30" y="220" font-size="20">2</text><text x="30" y="175" font-size="20">3</text><text x="30" y="130" font-size="20">4</text>
    <polyline points="72,152.51 101,197.51 131,223.84 160,242.51 190,257 219,268.84 249,278.84 278,287.51 308,295.16" fill="none" stroke="#087f8c" stroke-width="3"/>
    <g fill="#087f8c" stroke="#ffffff" stroke-width="2"><circle cx="72" cy="152.51" r="5"/><circle cx="131" cy="223.84" r="5"/><circle cx="219" cy="268.84" r="5"/><circle cx="308" cy="295.16" r="5"/></g>
    <text x="85" y="145" font-size="20">3.32</text><text x="142" y="219" font-size="20">1.74</text><text x="224" y="254" font-size="20">0.74</text><text x="282" y="279" font-size="20">0.15</text>
    <text x="72" y="333" text-anchor="middle" font-size="20">10%</text><text x="131" y="333" text-anchor="middle" font-size="20">30%</text><text x="219" y="333" text-anchor="middle" font-size="20">60%</text><text x="308" y="333" text-anchor="middle" font-size="20">90%</text>
    <text x="180" y="365" text-anchor="middle" font-size="20">给实际 token 的概率</text>
    <text x="180" y="390" text-anchor="middle" font-size="20">预测损失 ≠ 事实可信度</text>
  </g>
</svg>
